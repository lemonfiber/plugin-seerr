schema_version = 1

[plugin]
id          = "seerr"
name        = "Seerr"
version     = "1.0.0"
description = "Where the household asks for things"
without_it  = "Requests come to you in person"
upstream    = "https://github.com/seerr-team/seerr"
license     = "MIT"
forms       = ["library", "full"]

[[service]]
id          = "seerr"
name        = "Seerr"
image       = "ghcr.io/seerr-team/seerr"
digest      = "sha256:27602401178d54f1964442287b9f23f67a3fa2252645ee8065839ea1c3f69e45"
tag         = "v3.5.0"
port        = 5055
bind        = "lan"
listens     = 5055
health      = { kind = "http", path = "/api/v1/status", timeout_s = 90 }
criticality = "important"
memory_mib  = 250
reaches     = "the metadata provider it lists titles from"
asks_for    = "Reads the catalogue the household browses and requests from, and the artwork beside it."
config_path = "/app/config"
user_mode   = "uid"
replaces    = "seerr"

[service.env]
LOG_LEVEL = { setting = "seerr:log-level", default = "info" }
API_KEY   = { secret = "upstream-key" }

[[service]]
id          = "seerr-adapter"
name        = "Seerr adapter"
image       = "ghcr.io/lemonfiber/seerr-adapter"
digest      = "sha256:75af9bb9cfe0df0f825e5632881bb83d9b90e600fd99a81d551caff05555e98b"
tag         = "main-94f5360c7836"
criticality = "important"
reaches     = ""
asks_for    = "Nothing beyond this machine. It answers lemonfiber's request.intake contract by calling Seerr, beside it, with the key lemonfiber minted for it."
config_path = "/config"
listens     = 8080
speaks      = ["request.intake@1"]
fronts      = "seerr"
provides    = ["request.intake"]
upstream    = { api_key = { secret = "upstream-key" } }

[[secret]]
id     = "upstream-key"
of     = "seerr"
minted = true
why    = "The key Seerr answers its API to, which the adapter in front of it presents"
carried_from = { file = "/app/config/settings.json", format = "json", key = "main.apiKey" }

[[proof]]
id      = "seerr.identifies"
service = "seerr"
title   = "Seerr says which release it is to anybody"
fixture = "recordings/seerr/status-identifies.json"
why     = """
Seerr is the one service a household member reaches without being an
operator, so it answers before anybody signs in, and the adapter's readiness
is this answer.
"""
request = { method = "GET", path = "/api/v1/status" }
expect  = { status = 200, json_types = { version = "str", commitTag = "str" } }

[[proof]]
id      = "seerr.guarded"
service = "seerr"
title   = "Seerr lists the household's requests to nobody presenting nothing"
fixture = "recordings/seerr/requests-guarded.json"
why     = """
The requests name what each member asked for. Only the adapter asks, with the
key lemonfiber minted, so a Seerr that listed them to a caller presenting
nothing would be telling every device that can reach it.
"""
request = { method = "GET", path = "/api/v1/request" }
expect  = { status = 401 }

[[ask]]
service    = "seerr"
capability = "identity.source"

[[ask]]
service    = "seerr"
capability = "library.curate"
each       = true

[[ask]]
service    = "seerr"
capability = "request.gate"

[[ask]]
service    = "seerr"
capability = "proxy.front"

[[ask]]
service    = "seerr"
capability = "dashboard.show"

[[wiring]]
service  = "seerr"
hostname = "requests"
