# The plugin verdict on Seerr, from spec's first-party-plugin workflow (F3-R9, F5-R13),
# and the adapter's conformance recordings against the pinned Seerr (ARCH-R217).
name: plugin
on: [pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  plugin:
    uses: lemonfiber/spec/.github/workflows/first-party-plugin.yml@7e55a9fec4d241c758e560f98006a8abce38fb9b # v1.0.108

  # Every conformance recording is what the adapter answers now, in front of
  # the pinned Seerr. It starts a throwaway Seerr at that digest from the
  # starting files, builds the adapter from this tree, runs it as lemonfiber
  # runs it, asks every case of the contract it speaks, and fails where an
  # answer differs (ARCH-R217).
  recordings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: The recordings, against the image they name
        run: python3 .github/record.py --check
