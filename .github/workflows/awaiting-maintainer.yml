# The maintainer queue flag (OPS-R26, OPS-R27). The checks `main` requires:
#
#   gates     gates / gates
#   pin-only  pin-only / pin-only
#   plugin    plugin / what changed, plugin / plugin
#   codeql    analyze, alerts / alerts
#   sonar     gate / gate
name: awaiting-maintainer
on:
  workflow_run:
    workflows: [gates, pin-only, plugin, codeql, sonar]
    types: [completed]
  pull_request_review:
    types: [submitted]
  pull_request_target:
    types: [closed]
permissions:
  contents: read
jobs:
  awaiting:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/awaiting-maintainer.yml@579dd00118f557a9ff703c988a0648012b828bed # v1.0.98
    secrets:
      DISCORD_MAINTAINERS_WEBHOOK: ${{ secrets.DISCORD_MAINTAINERS_WEBHOOK }}
