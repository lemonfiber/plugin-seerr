# The supply-chain posture check (Q-R56, Q-R59), called from spec.
name: scorecard
on:
  workflow_dispatch:
  branch_protection_rule:
  schedule:
    - cron: "26 6 * * 1"
permissions:
  contents: read
jobs:
  scorecard:
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    secrets:
      SCORECARD_TOKEN: ${{ secrets.SCORECARD_TOKEN }}
    uses: lemonfiber/spec/.github/workflows/scorecard.yml@e745e0f7f79f5f2e76b68e560b1c28e1df956493 # v1.0.103
