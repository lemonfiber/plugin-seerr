# Gate pull requests on zero SonarCloud issues (Q-R64). The scan is
# SonarCloud's Automatic Analysis; the shared gate reads its summary.
name: sonar
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  gate:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/sonar-gate.yml@98f21cb8a4db83cfc079c1a848d977818af80c70 # v1.0.115
    with:
      allowed-open: 0
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
