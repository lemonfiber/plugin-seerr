# The SonarCloud issue gate (Q-R64). A bundled part holds no code a scan reads.
name: sonar
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  gate:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/sonar-gate.yml@e745e0f7f79f5f2e76b68e560b1c28e1df956493 # v1.0.103
    with:
      allowed-open: 0
      code: false
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
